name: Release Archetypes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archetype zips
        run: |
          chmod +x ./build-archetypes.sh
          ./build-archetypes.sh

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Archetypes
          body: |
            Build automático do commit ${{ github.sha }}.
            Atualizado em cada push na branch `main`.
          files: dist/*.zip
          make_latest: true
